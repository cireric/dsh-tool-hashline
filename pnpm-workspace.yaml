packages:
  - "packages/*"

# Windows without symlink privileges: pnpm's default isolated linker creates
# directory junctions, and this Node build's ESM resolver does not follow them
# (fs.realpathSync returns the logical path), so every transitive dependency of a
# linked package becomes ERR_MODULE_NOT_FOUND. A hoisted tree uses real files, so
# plain Node resolution works.
nodeLinker: hoisted

# pnpm 11 treats an unlisted dependency build script as a hard install error.
# The reviewed decisions live in `allowBuilds` below; keep the install exit
# code clean instead of failing the gate on a script we have already reviewed.
strictDepBuilds: false

patchedDependencies:
  '@hy-sde-org/dsh-hashline@0.2.1-alpha.4': patches/@hy-sde-org__dsh-hashline@0.2.1-alpha.4.patch
  '@hy-sde-org/dsh-tool-edit@0.2.1-alpha.4': patches/@hy-sde-org__dsh-tool-edit@0.2.1-alpha.4.patch

# Build-script decisions for the two dependencies that declare one. pnpm 11
# replaced the old `ignoredBuiltDependencies` list with this map and writes the
# placeholder entries itself on an interactive install; `false` is its
# "ignored build script" record, so no script here runs unreviewed.
allowBuilds:
  esbuild: false
  koffi: false
